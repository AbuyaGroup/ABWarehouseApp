name: abwarehouse
description: Abuya Group Warehouse Management app
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  mobile_scanner: ^7.0.1
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8

  # DITAMBAHIN: buat konek ke Supabase (dipake khusus fitur Stock Opname)
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  rename: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/kagetshort.mp3
    - assets/images/logo_ABI.png
    - assets/icon/logo_ABI.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo_ABI.png"
